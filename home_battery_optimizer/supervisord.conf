[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:home-battery-optimizer]
command=__PYTHON__ rest_service.py --host 0.0.0.0 --port 8000
directory=__DIR__
autostart=true
autorestart=true
startsecs=3
startretries=5
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
